name: Bicolmena Cryptographic Evidence Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # =========================================================================
  # JOB 1 · RUN ALL REAL TESTS (Least Privilege: contents: read)
  # =========================================================================
  test-audio-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install System Audio Libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libsndfile1
      
      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Setup RVC Neural Runtime & Frozen Weights (Hardened Verification)
        run: |
          python scripts/setup_rvc_ci.py
      
      - name: Execute 8 Real Audio Tests (Strict Sequential Execution)
        run: |
          set -euo pipefail
          python tests/audio_001_dsp_qc.py
          python tests/audio_002_resampling.py
          python tests/audio_003_musicgen.py
          python tests/audio_004a_rvc.py
          python tests/audio_004q_quality.py
          python tests/audio_004r_resample_vocal.py
          python tests/audio_005_integration.py
          python tests/audio_005q_speech.py
      
      - name: Assert All 8 Tests Passed
        run: |
          python consolidation/assert_all_pass.py
      
      - name: Upload Test Metrics & Audio Evidence
        uses: actions/upload-artifact@v4
        with:
          name: test-results-and-evidence
          path: |
            AUDIO-*_metrics.json
            raw_musicgen_32k.wav
            resampled_musicgen_48k.wav
            neural_flamenco_bolero_master.wav
            evidence/
          retention-days: 1

  # =========================================================================
  # JOB 2 · CONSOLIDATE LEDGER SNAPSHOT (Least Privilege: contents: read)
  # =========================================================================
  consolidate-ledger:
    needs: [test-audio-pipeline]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      snapshot_file: ${{ steps.create-snapshot.outputs.snapshot_file }}
      manifest_file: ${{ steps.create-snapshot.outputs.manifest_file }}
      snapshot_sha: ${{ steps.create-snapshot.outputs.snapshot_sha }}
      release_tag: ${{ steps.create-snapshot.outputs.release_tag }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Download Test Results & Evidence
        uses: actions/download-artifact@v4
        with:
          name: test-results-and-evidence
      
      - name: Fetch Latest Parent Release
        id: parent
        run: |
          LATEST=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          if [ -n "$LATEST" ]; then
            echo "parent_tag=$LATEST" >> $GITHUB_OUTPUT
            gh release download "$LATEST" -p "manifest_*.json" 2>/dev/null || true
            if [ -f manifest_*.json ]; then
              echo "parent_sha=$(jq -r '.sha256' manifest_*.json | head -1)" >> $GITHUB_OUTPUT
            else
              echo "parent_sha=none" >> $GITHUB_OUTPUT
            fi
          else
            echo "parent_tag=GENESIS" >> $GITHUB_OUTPUT
            echo "parent_sha=none" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build Chained Snapshot & Manifest
        id: create-snapshot
        run: |
          python consolidation/mem_audio_consolidate.py \
            --parent-tag "${{ steps.parent.outputs.parent_tag }}" \
            --parent-sha "${{ steps.parent.outputs.parent_sha }}" \
            --ci-run-id "${{ github.run_id }}" \
            --git-commit "${{ github.sha }}"
          
          SNAP=$(ls snapshot_MEM-AUDIO_*.json | head -1)
          MAN=$(ls manifest_MEM-AUDIO_*.json | head -1)
          SHA=$(sha256sum "$SNAP" | awk '{print $1}')
          TAG="mem-audio-${{ github.run_number }}-$(date +%Y%m%d%H%M%S)"
          
          echo "snapshot_file=$SNAP" >> $GITHUB_OUTPUT
          echo "manifest_file=$MAN" >> $GITHUB_OUTPUT
          echo "snapshot_sha=$SHA" >> $GITHUB_OUTPUT
          echo "release_tag=$TAG" >> $GITHUB_OUTPUT
      
      - name: Package Full Evidence Bundle
        run: |
          tar -czf "evidence_${{ github.run_id }}.tar.gz" \
            AUDIO-*_metrics.json \
            raw_musicgen_32k.wav \
            resampled_musicgen_48k.wav \
            neural_flamenco_bolero_master.wav \
            evidence/
      
      - name: Upload Consolidated Snapshot Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-snapshot
          path: |
            snapshot_MEM-AUDIO_*.json
            manifest_MEM-AUDIO_*.json
            evidence_*.tar.gz
          retention-days: 1

  # =========================================================================
  # JOB 3 · VERIFY BEFORE SIGNING (Least Privilege: contents: read)
  # =========================================================================
  verify-pre-sign:
    needs: [consolidate-ledger]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Download Snapshot & Evidence Package
        uses: actions/download-artifact@v4
        with:
          name: consolidated-snapshot
      
      - name: Extract Evidence Bundle
        run: |
          TAR=$(ls evidence_*.tar.gz | head -1)
          tar -xzf "$TAR"
      
      - name: Verify Snapshot & Physical Evidence Offline (Strict Mode)
        run: |
          python consolidation/mem_audio_verify.py \
            --snapshot "${{ needs.consolidate-ledger.outputs.snapshot_file }}" \
            --manifest "${{ needs.consolidate-ledger.outputs.manifest_file }}" \
            --strict
          
          python consolidation/verify_chain.py

  # =========================================================================
  # JOB 4 · SIGN, ATTEST & PUBLISH (Privileged: id-token, attestations, contents)
  # =========================================================================
  sign-and-release:
    needs: [consolidate-ledger, verify-pre-sign]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write       # Para crear el GitHub Release
      id-token: write       # Requerido para Sigstore OIDC token
      attestations: write   # Requerido para actions/attest-build-provenance
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Download Snapshot & Evidence
        uses: actions/download-artifact@v4
        with:
          name: consolidated-snapshot
      
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
      
      - name: Sign Snapshot with Cosign (Sigstore Bundle Format)
        run: |
          SNAP="${{ needs.consolidate-ledger.outputs.snapshot_file }}"
          BUNDLE="${SNAP}.sigstore.json"
          
          echo "🔏 Firmando snapshot en formato Sigstore Bundle..."
          cosign sign-blob \
            --yes \
            --bundle "$BUNDLE" \
            "$SNAP"
          
          echo "🔍 Verificando firma contra identidad estricta de workflow..."
          cosign verify-blob \
            --bundle "$BUNDLE" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/bicolmena-crypto-pipeline.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$SNAP"
          
          echo "✅ Firma Sigstore Bundle verificada."
      
      - name: Generate SLSA Build Attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "${{ needs.consolidate-ledger.outputs.snapshot_file }}"
      
      - name: Create and Verify Immutable GitHub Release
        run: |
          TAG="${{ needs.consolidate-ledger.outputs.release_tag }}"
          SNAP="${{ needs.consolidate-ledger.outputs.snapshot_file }}"
          MAN="${{ needs.consolidate-ledger.outputs.manifest_file }}"
          BUNDLE="${SNAP}.sigstore.json"
          TAR=$(ls evidence_*.tar.gz 2>/dev/null || echo "")
          
          echo "## 🏛️ Bicolmena Immutable Ledger Snapshot" > release_notes.md
          echo "- **Snapshot File:** \`$SNAP\`" >> release_notes.md
          echo "- **SHA-256:** \`${{ needs.consolidate-ledger.outputs.snapshot_sha }}\`" >> release_notes.md
          echo "- **Sigstore Bundle:** \`$BUNDLE\`" >> release_notes.md
          echo "- **CI Run ID:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> release_notes.md
          echo "- **Git Commit:** \`${{ github.sha }}\`" >> release_notes.md
          echo "" >> release_notes.md
          echo "### 🔍 Offline Verification with Cosign" >> release_notes.md
          echo "\`\`\`bash" >> release_notes.md
          echo "cosign verify-blob \\" >> release_notes.md
          echo "  --bundle $BUNDLE \\" >> release_notes.md
          echo "  --certificate-identity \"https://github.com/${{ github.repository }}/.github/workflows/bicolmena-crypto-pipeline.yml@refs/heads/main\" \\" >> release_notes.md
          echo "  --certificate-oidc-issuer \"https://token.actions.githubusercontent.com\" \\" >> release_notes.md
          echo "  $SNAP" >> release_notes.md
          echo "\`\`\`" >> release_notes.md
          
          echo "📦 Creando GitHub Release en estado DRAFT: $TAG"
          gh release create "$TAG" \
            "$SNAP" \
            "$MAN" \
            "$BUNDLE" \
            $TAR \
            --draft \
            --title "Snapshot $TAG" \
            --notes-file release_notes.md
          
          echo "🔍 Verificando presencia estricta de assets en DRAFT..."
          INFO=$(gh release view "$TAG" --json isDraft,assets)
          echo "$INFO" | jq -e '.isDraft == true'
          for expected in "$SNAP" "$MAN" "$BUNDLE"; do
            echo "$INFO" | jq -e --arg n "$expected" '.assets[].name | select(. == $n)' >/dev/null
          done
          
          echo "🚀 Publicando Release como INMUTABLE..."
          gh release edit "$TAG" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
